name: Publish

on:
  release:
    types: [published]

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - run: corepack enable

      - run: pnpm install --frozen-lockfile

      - run: npm install -g version-patch

      - name: Set the version
        run: version-patch node "${{ github.event.release.tag_name }}" --prefix v

      - run: pnpm build

      - run: npm publish

      - name: Push the version
        run: >
          version-patch git-push package.json
          --msg "chore(release): ${{ github.event.release.tag_name }}"
          --name "github-actions[bot]"
          --email "41898282+github-actions[bot]@users.noreply.github.com"
